project:
  name: evalues_translation_routing
  dataset_name: sib200
  seed: 20260817
  output_root: outputs
  device: auto
  deterministic: true

dataset:
  id: Davlan/sib200
  revision: 38977a667f6fc264d5c26ec57a01e16db040b358
  task: topic_classification
  discovery_splits: [train, validation]
  evaluation_split: test
  languages:
    - {name: English, code: eng_Latn, translate: false}
    - {name: French, code: fra_Latn, translate: true}
    - {name: German, code: deu_Latn, translate: true}
    - {name: Spanish, code: spa_Latn, translate: true}
    - {name: Chinese, code: zho_Hans, translate: true}
    - {name: Arabic, code: arb_Arab, translate: true}
    - {name: Turkish, code: tur_Latn, translate: true}
    - {name: Japanese, code: jpn_Jpan, translate: true}
    - {name: Polish, code: pol_Latn, translate: true}
    - {name: Dutch, code: nld_Latn, translate: true}
    - {name: Swahili, code: swh_Latn, translate: true}
    - {name: Bengali, code: ben_Beng, translate: true}
    - {name: Telugu, code: tel_Telu, translate: true}
    - {name: Amharic, code: amh_Ethi, translate: true}
    - {name: Afrikaans, code: afr_Latn, translate: true}
  labels:
    - science/technology
    - travel
    - politics
    - sports
    - health
    - entertainment
    - geography
  max_rows_per_language: null

fixed_router:
  translated_languages: [swh_Latn, ben_Beng, tel_Telu, amh_Ethi, afr_Latn]

runtime:
  save_translations: true
  save_embeddings: false
  overwrite_completed_runs: false
  num_workers: 1

include_configs:
  models: configs/models.yaml
  statistics: configs/statistical_protocol.yaml
